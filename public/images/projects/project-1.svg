    <text x="40" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Q: What is the primary role of backpropagation?</text>
    <rect x="40" y="222" width="200" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" />
    <text x="52" y="241" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#38BDF8">Compute Gradient Vector</text>
    <rect x="255" y="222" width="200" height="28" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
    <text x="267" y="241" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Forward Pass Weights</text>
