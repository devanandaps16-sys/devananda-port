<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B2A" />
      <stop offset="100%" stop-color="#052E3E" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#p2Grad)" />
  
  <g transform="translate(40, 40)">
    <rect width="520" height="300" rx="14" fill="#041E2D" stroke="rgba(45,212,191,0.2)" stroke-width="1.5" />
    <circle cx="24" cy="22" r="5" fill="#EF4444" />
    <circle cx="40" cy="22" r="5" fill="#F59E0B" />
    <circle cx="56" cy="22" r="5" fill="#10B981" />
    <text x="90" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#5EEAD4">VisionPulse AI Screening Console</text>

    <!-- Scan Canvas Viewport -->
    <rect x="24" y="55" width="230" height="220" rx="10" fill="#02131D" stroke="rgba(45,212,191,0.3)" />
    <!-- Chest X-Ray Grid Simulation -->
    <circle cx="139" cy="140" r="60" fill="none" stroke="rgba(20,184,166,0.4)" stroke-dasharray="4,4" />
    <path d="M 80 160 Q 140 100 200 160" stroke="#2DD4BF" stroke-width="2" fill="none" />
    <circle cx="150" cy="130" r="15" fill="#EF4444" opacity="0.4" />
    <rect x="35" y="240" width="208" height="24" rx="6" fill="rgba(45,212,191,0.15)" />
    <text x="50" y="256" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#2DD4BF">HEATMAP: PULMONARY FOCUS REGION</text>

