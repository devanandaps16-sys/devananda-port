    <text x="286" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#2DD4BF">96.8% Confidence</text>

    <rect x="270" y="175" width="225" height="100" rx="10" fill="#062638" stroke="rgba(255,255,255,0.08)" />
    <text x="286" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F0FDFA">Model Architecture</text>
